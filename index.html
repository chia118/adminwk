<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者後端 | 人員動態與紀錄管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #7d6e63;
      --primary-hover: #63564d;
      --bg: #f7f5f0;
      --card-bg: #ffffff;
      --border: #eae5df;
      --text: #4a403a;
      --muted: #9e938a;
    }

    * {
      box-sizing: border-box;
      word-break: break-word;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.03);
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--primary);
      margin: 0;
    }

    .btn-refresh {
      padding: 8px 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-refresh:hover {
      background-color: var(--primary-hover);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-btn {
      padding: 10px 16px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 監控人員分頁內部的子分頁樣式 */
    .sub-nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .sub-tab-btn {
      padding: 6px 14px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .sub-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* 子分頁新消息星星提示 */
    .new-message-star {
      display: none;
      margin-left: 6px;
      vertical-align: middle;
      color: #f5b301;
      font-size: 15px;
      line-height: 1;
      text-shadow: 0 0 5px rgba(245,179,1,0.45);
      animation: newMessageStarPulse 1.4s infinite;
    }

    .new-message-star.show {
      display: inline-block;
    }

    @keyframes newMessageStarPulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: .55;
        transform: scale(1.18);
      }
    }

    .sub-tab-content {
      display: none;
    }

    .sub-tab-content.active {
      display: block;
    }

    .filter-panel {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      background: #faf9f7;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      align-items: center;
    }

    select,
    input {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      background: #fff;
      font-size: 0.9rem;
    }

    input[type="time"]::-webkit-datetime-edit-ampm-field {
      display: none;
    }

    .input-money {
      width: 75px;
      text-align: right;
      padding: 4px 6px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .salary-table input,
    .salary-table .salary-date,
    .salary-table .salary-time,
    .salary-table .salary-location,
    .salary-table .input-money {
      font-size: calc(0.82rem + 1px);
    }

    #salaryStartDate,
    #salaryEndDate,
    .salary-table .salary-date,
    .salary-table .salary-time {
      font-family: inherit !important;
    }

    .salary-table .salary-self,
    .salary-table .salary-fare {
      text-align: left !important;
    }

    .salary-table {
      width: 100%;
      min-width: 940px;
      table-layout: auto;
      border-collapse: collapse;
    }

    .salary-table th,
    .salary-table td {
      box-sizing: border-box;
      padding: 8px 7px;
      vertical-align: middle;
      white-space: nowrap;
    }

    .salary-table .col-name { width: 55px; }
    .salary-table .col-date { width: 145px; min-width: 145px; }
    .salary-table .col-time { width: 115px; min-width: 115px; }
    .salary-table .col-location { width: 125px; min-width: 125px; }
    .salary-table .col-hourly { width: 85px; min-width: 85px; }
    .salary-table .col-fare { width: 80px; min-width: 80px; }
    .salary-table .col-hours { width: 75px; min-width: 75px; }
    .salary-table .col-note { min-width: 150px; }

    .salary-table .salary-date {
      width: 140px;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
    }

    .salary-table .salary-time {
      width: 105px;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: calc(0.82rem + 2px);
    }

    .salary-table .salary-location {
      width: 105px;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
    }

    .salary-table .input-money {
      width: 75px;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
    }

    .salary-table td > div {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    #salaryResultArea {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      min-width: 600px;
    }

    th,
    td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }

    th {
      background-color: #faf9f7;
      color: var(--primary);
      font-weight: 600;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .tag-上班 {
      background-color: #e8f3ec;
      color: #3d7a5a;
    }

    .tag-下班 {
      background-color: #fbeee9;
      color: #b56247;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(1.2);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .mode-select {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--primary);
      font-weight: 500;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .mode-select:hover {
      border-color: var(--primary);
    }

    .btn-action {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .btn-delete {
      background-color: #ffffff;
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 4px 8px;
      font-size: 0.8rem;
      margin-left: 4px;
    }

    .btn-delete:hover {
      background-color: #faf9f7;
    }

    .btn-delete .delete-x {
      color: #dc2626;
      font-weight: 700;
      margin-right: 3px;
    }

    .btn-edit {
      background-color: #ffffff;
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 4px 8px;
      font-size: 0.8rem;
      margin-left: 4px;
    }

    .btn-edit:hover {
      background-color: #faf9f7;
    }

    .btn-add {
      background-color: var(--primary);
      color: white;
    }

    .btn-add:hover {
      background-color: var(--primary-hover);
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }

    .modal-header {
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 4px;
      color: var(--muted);
    }

    .form-group input,
    .form-group select {
      width: 100%;
      box-sizing: border-box;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
  
    /* 薪資表日期與上下班時間可直接修改，修改後自動重算時數 */
    .salary-date,
    .salary-time {
      cursor: pointer;
    }
    .salary-row-hours {
      font-weight: 700;
    }

  
    .status-section-title {
      font-size: 16px;
      font-weight: 700;
      padding: 14px 8px 10px;
      margin-top: 10px;
      border-bottom: 1px solid #e5e0da;
    }
    .status-online-title { color: #3d7a5a; }
    .status-offline-title { color: #dc2626; margin-top: 24px; }
    </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🛡️ 全員動態與後端管理控制台</h1>
      <button class="btn-refresh" onclick="loadAllData()">🔄 刷新資料</button>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('statusOnTab')">
        📱 人員狀態監控
      </button>

      <button class="tab-btn" onclick="switchTab('historyTab')">
        📋 個人打卡紀錄
      </button>

      <button class="tab-btn" onclick="switchTab('salaryTab')">
        💰 薪資計算
      </button>
    </div>

    <div id="statusOnTab" class="tab-content active">
      <!-- 監控人員分頁內部的子分頁按鈕 (在線人員在前，上班中在後) -->
      <div class="sub-nav-tabs">
        <button class="sub-tab-btn active" onclick="switchSubTab('onlineSubTab', this)">
          目前狀態<span class="new-message-star" id="onlineNewDot" aria-label="有新消息">★</span>
        </button>
        <button class="sub-tab-btn" onclick="switchSubTab('workingSubTab', this)">
          目前上班中 (<span id="workingCount">0</span>)<span class="new-message-star" id="workingNewDot" aria-label="有新消息">★</span>
        </button>
      </div>

      <!-- 目前狀態子分頁 -->
      <div id="onlineSubTab" class="sub-tab-content active">

        <div class="status-section-title status-online-title">🟢 在線人員</div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>姓名</th>
                <th>狀態</th>
                <th>更新時間</th>
                <th>選擇模式</th>
                <th>狀態提交備註</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="onlineTableBody">
              <tr>
                <td colspan="6" class="loading">載入中...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="status-section-title status-offline-title">🔴 離線人員</div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>姓名</th>
                <th>狀態</th>
                <th>更新時間</th>
                <th>選擇模式</th>
                <th>狀態提交備註</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="offlineTableBody">
              <tr>
                <td colspan="6" class="loading">載入中...</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>

      <!-- 前台送出 OFF：只顯示最近 1 小時 -->
      <div id="offRecentSubTab" class="sub-tab-content" style="display:none;">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>姓名</th>
                <th>狀態</th>
                <th>送出時間</th>
                <th>選擇模式</th>
                <th>備註</th>
              </tr>
            </thead>
            <tbody id="offRecentTableBody">
              <tr>
                <td colspan="5" class="loading">載入中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 目前上班中子分頁 -->
      <div id="workingSubTab" class="sub-tab-content">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>姓名</th>
                <th>狀態</th>
                <th>更新時間</th>
                <th>上班地點</th>
                <th>人員備註</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="workingTableBody">
              <tr>
                <td colspan="6" class="loading">載入中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="historyTab" class="tab-content">
      <div class="filter-panel">
        <input
          type="text"
          id="nameSearchInput"
          placeholder="🔍 請輸入姓名或關鍵字"
          oninput="renderHistory()"
        >
        <select id="rangeFilter" onchange="renderHistory()">
          <option value="daily">當天 (Daily)</option>
          <option value="weekly">本週 (Weekly)</option>
          <option value="3months" selected>近三個月 (3 Months)</option>
        </select>
        <button
          class="btn-action btn-add"
          style="margin-left:auto;"
          onclick="openAddModal()"
        >
          ＋ 管理者補打卡
        </button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>日期</th>
              <th>時間</th>
              <th>地點</th>
              <th>狀態</th>
              <th>上下班備註</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr>
              <td colspan="7" class="loading">
                資料載入中...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="salaryTab" class="tab-content">
      <div class="filter-panel">
        <input
          type="text"
          id="salaryNameInput"
          placeholder="🔍 請輸入姓名或關鍵字"
        >
        <span style="font-size:0.85rem;color:var(--muted);">開始：</span>
        <input type="date" id="salaryStartDate">
        <span style="font-size:0.85rem;color:var(--muted);">結束：</span>
        <input type="date" id="salaryEndDate">
        <button class="btn-action btn-add" onclick="calculateSalary()">
          🧮 計算薪資班表
        </button>
      </div>

      <div id="salaryResultArea" style="display:none;" class="table-wrapper">
        <table class="salary-table">
          <colgroup>
            <col class="col-name">
            <col class="col-date">
            <col class="col-time">
            <col class="col-time">
            <col class="col-location">
            <col class="col-hourly">
            <col class="col-fare">
            <col class="col-hours">
            <col class="col-note">
          </colgroup>
          <thead>
            <tr>
              <th>姓名</th>
              <th>日期</th>
              <th>上班時間</th>
              <th>下班時間</th>
              <th>地點</th>
              <th>時薪</th>
              <th>車資</th>
              <th>時數</th>
              <th>備註</th>
            </tr>
          </thead>
          <tbody id="salaryTableBody"></tbody>
        </table>
      </div>

      <div id="salarySummary" style="display:none; margin-top:12px; padding:12px 16px; background:#faf7f3; border:1px solid var(--border); border-radius:8px; display:flex; gap:24px; flex-wrap:wrap; align-items:center;">
        <div><strong>總時數：</strong><span id="totalHours">0.0</span> hr</div>
        <div><strong>總車資：</strong><span id="totalFare">0</span></div>
        <div style="display:flex; align-items:center; gap:6px;">
          <strong>房租：</strong>
          <input id="rentAmount" type="number" min="0" step="1" value="0"
                 style="width:90px; padding:5px 8px; border:1px solid var(--border); border-radius:6px; box-sizing:border-box;">
        </div>
        <div><strong>總金額：</strong>$<span id="totalAmount">0</span></div>
      </div>

      <div id="salaryEmptyTip" class="loading">
        請輸入姓名與選擇日期範圍後點擊「計算薪資班表」
      </div>
    </div>

  </div>

  <div id="noteEditModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">編輯上下班備註</div>
      <div class="form-group">
        <label>備註</label>
        <input type="text" id="editNoteInput" placeholder="留白即可清除備註">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-action" id="cancelEditNoteBtn">取消</button>
        <button type="button" class="btn-action btn-add" id="saveEditNoteBtn">儲存</button>
      </div>
    </div>
  </div>

  <div id="addModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        管理者手動新增/補打卡
      </div>
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="modalName" placeholder="請輸入姓名">
      </div>
      <div class="form-group">
        <label>類別</label>
        <select id="modalType">
          <option value="上班">上班</option>
          <option value="下班">下班</option>
        </select>
      </div>
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="modalDate">
      </div>
      <div class="form-group">
        <label>時間</label>
        <input type="time" id="modalTime">
      </div>
      <div class="form-group">
        <label>地點</label>
        <input type="text" id="modalLocation" placeholder="例：OW、八度">
      </div>
      <div class="form-group">
        <label>備註</label>
        <input type="text" id="modalNote" placeholder="選填備註">
      </div>
      <div class="modal-actions">
        <button class="btn-action" onclick="closeAddModal()">取消</button>
        <button class="btn-action btn-add" onclick="submitAddRecord()">新增打卡</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwEJG79ivxM0CrOiRegiZl_qI4Pxf_9BJKxCKyyAYcDc9bq3A3joFrfSiL7ABpq25so/exec';
    let rawData = [];

    function formatDate(rawVal) {
      if (!rawVal) return '';
      const str = String(rawVal).trim();
      if (str.includes('T')) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
      }
      return str.split('T')[0].split(' ')[0];
    }

    function formatTime(rawVal) {
      if (!rawVal) return '';
      const str = String(rawVal).trim();
      if (str.includes('T')) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
      }
      let clean = str.replace(/[上下]午/g, '').trim();
      const match = clean.match(/(\d{1,2}):(\d{2})/);
      if (match) {
        let h = parseInt(match[1], 10);
        const m = match[2];
        if (/pm/i.test(clean) && h < 12) h += 12;
        if (/am/i.test(clean) && h === 12) h = 0;
        return `${String(h).padStart(2, '0')}:${m}`;
      }
      return str.length > 5 ? str.substring(0, 5) : str;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      const idx = {
        statusOnTab: 0,

    function switchSubTab(subTabId, btn) {
      document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.sub-tab-content').forEach(c => c.classList.remove('active'));

    function getTodayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    // ===== 子分頁新消息紅點 =====
    // 每個分頁記錄自己最後看過的資料版本（最大 rowIndex）。
    const STATUS_TAB_SEEN_KEY = 'attendance_status_tab_seen_v1';

    function getStatusTabSeen() {
      try {
        return JSON.parse(localStorage.getItem(STATUS_TAB_SEEN_KEY) || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveStatusTabSeen(data) {
      localStorage.setItem(STATUS_TAB_SEEN_KEY, JSON.stringify(data));
    }

    function getLatestRowIndex(users) {
      if (!users || !users.length) return 0;
      return Math.max(...users.map(r => Number(r.rowIndex) || 0));
    }

    function showNewMessageDot(tabName, show) {
      const dot = document.getElementById(
        tabName === 'online' ? 'onlineNewDot' : 'workingNewDot'
      );
      if (dot) dot.classList.toggle('show', !!show);
    }

    function markStatusTabSeen(tabName) {
      const seen = getStatusTabSeen();
      const latest = tabName === 'online'
        ? getCurrentOnlineUsers()
        : getCurrentWorkingUsers();

      seen[tabName] = getLatestRowIndex(latest);
      saveStatusTabSeen(seen);
      showNewMessageDot(tabName, false);
    }

    function updateStatusTabNewMessageDots(onlineUsers, workingUsers) {
      const seen = getStatusTabSeen();

      const onlineLatest = getLatestRowIndex(onlineUsers);
      const workingLatest = getLatestRowIndex(workingUsers);

      // 第一次載入不算新消息，避免頁面剛開就出現紅點。
      if (seen.online === undefined) {
        seen.online = onlineLatest;
      }

      if (seen.working === undefined) {
        seen.working = workingLatest;
      }

      saveStatusTabSeen(seen);

      showNewMessageDot('online', onlineLatest > Number(seen.online || 0));
      showNewMessageDot('working', workingLatest > Number(seen.working || 0));

      // 如果目前正在該分頁，視為已讀。
      const onlineActive = document.getElementById('onlineSubTab')?.classList.contains('active');
      const workingActive = document.getElementById('workingSubTab')?.classList.contains('active');

      if (onlineActive) markStatusTabSeen('online');
      if (workingActive) markStatusTabSeen('working');
    }

    function parseRecordDateTime(record) {
      const dateStr = String(record.date || '').trim();
      const timeStr = String(record.time || '').trim();
      if (!dateStr || !timeStr) return null;

      // 支援 YYYY-MM-DD、YYYY/MM/DD 與 Date 物件字串。
      const normalizedDate = dateStr.replace(/\//g, '-');
      const t = timeStr.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);

      if (!t) return null;

      let year, month, day;

      let m = normalizedDate.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (m) {
        year = Number(m[1]);
        month = Number(m[2]);
        day = Number(m[3]);
      } else {
        m = normalizedDate.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
        if (m) {
          month = Number(m[1]);
          day = Number(m[2]);
          year = Number(m[3]);
        } else {
          return null;
        }
      }

      const d = new Date(
        year,
        month - 1,
        day,
        Number(t[1]),
        Number(t[2]),
        Number(t[3] || 0)
      );

      return isNaN(d.getTime()) ? null : d;
    }

    function renderRecentOffUsers() {
      const tbody = document.getElementById('offRecentTableBody');
      if (!tbody) return;

      const now = new Date();
      const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);

      const recentOff = rawData
        .filter(r => {
          if (!r.name || r.name === '姓名' || r.type !== '狀態') return false;

          const isOff =
            r.statusIsOn === false ||
            String(r.statusIsOn).toLowerCase() === 'false' ||
            String(r.statusMode || '').trim() === 'OFF';

          if (!isOff) return false;

          const dt = parseRecordDateTime(r);
          return dt && dt >= oneHourAgo && dt <= now;
        })
        .sort((a, b) => {
          const da = parseRecordDateTime(a);
          const db = parseRecordDateTime(b);
          return db - da;
        });

      if (recentOff.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="loading">最近 1 小時內沒有前台 OFF 紀錄</td></tr>';
        return;
      }

      tbody.innerHTML = recentOff.map(info => {
        const note = info.note
          ? String(info.note).replace(/^\u200B/, '').replace(/^\[補\]\s*/, '')
          : '-';

        return `

            <td>
              <span class="status-badge" style="color:#64748b;">
                🔴 離線

            </td>
            <td>${escapeHtml(info.time || '-')}</td>
            <td>OFF</td>
            <td>${escapeHtml(note)}</td>

    document.addEventListener('click', function(event) {
      const btn = event.target.closest('.status-note-edit-btn');
      if (!btn) return;

      event.preventDefault();
      event.stopPropagation();

      const rowIndex = Number(btn.getAttribute('data-row-index'));
      const name = btn.getAttribute('data-name') || '';
      const currentNote = btn.getAttribute('data-note') || '';

      if (!Number.isInteger(rowIndex) || rowIndex < 2) {

    function editStatusSubmitNote(rowIndex, name, currentNote) {
      const newNote = prompt(
        '請輸入狀態提交備註（留白即可清除）',
        currentNote || ''
      );

      if (newNote === null) return;

      const payload = {
        action: 'updateStatusNote',
        name: String(name || '').trim(),
        rowIndex: Number(rowIndex),
        note: String(newNote).trim()
      };

      fetch('https://script.google.com/macros/s/AKfycbwEJG79ivxM0CrOiRegiZl_qI4Pxf_9BJKxCKyyAYcDc9bq3A3joFrfSiL7ABpq25so/exec', {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      })
      .then(response => response.text())
      .then(raw => {
        let result;
        try {
          result = JSON.parse(raw);
        } catch (e) {
          throw new Error('GAS 回傳的資料格式錯誤');
        }

        if (result && result.result === 'success') {
          alert('✅ 狀態提交備註已更新');
          loadAllData();
          return;
        }

        throw new Error(
          (result && result.message) ||
          'GAS 尚未支援 updateStatusNote，請更新 Apps Script'
        );
      })
      .catch(error => {
        console.error('updateStatusNote error:', error);
        alert('狀態提交備註更新失敗：' + error.message);
      });
    }

      const offlineTbody = document.getElementById('offlineTableBody');

      rawData.forEach(r => {

          userMap[key] = r;
        }
      });

      const latestUsers = Object.values(userMap);

      // 在線：只顯示目前 ON 的「狀態」人員。
      // 「上班中」獨立顯示在「目前上班中」，不再出現在目前狀態。
      const onlineUsers = latestUsers.filter(info => {
        if (info.type === '上班') return false;
        if (info.type === '狀態') return info.statusIsOn === true;
        return info.statusIsOn === true;
      });

      // 離線：前台送出的 OFF，只保留最近 1 小時。
      const now = new Date();
      const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
      const recentOffMap = {};

      rawData.forEach(info => {
        if (!info.name || info.name === '姓名' || info.type !== '狀態') return;

        const isOff =
          info.statusIsOn === false ||
          String(info.statusIsOn).toLowerCase() === 'false' ||
          String(info.statusMode || '').trim() === 'OFF';

        if (!isOff) return;

        const dt = parseRecordDateTime(info);
        if (!dt || dt < oneHourAgo || dt > now) return;

        const key = String(info.name).trim().toLowerCase();
        if (!recentOffMap[key] ||
            Number(info.rowIndex) > Number(recentOffMap[key].rowIndex)) {
          recentOffMap[key] = info;
        }
      });

      const onlineNameSet = new Set(
        onlineUsers.map(info => String(info.name).trim().toLowerCase())
      );

      const offlineUsers = Object.values(recentOffMap).filter(info =>
        !onlineNameSet.has(String(info.name).trim().toLowerCase())

      function renderRows(tbody, users, emptyText, offline) {
        if (!tbody) return;

        if (!users.length) {
          tbody.innerHTML =
            `<tr><td colspan="6" class="loading">${emptyText}</td></tr>`;

        tbody.innerHTML = '';

          .sort((a, b) => Number(b.rowIndex) - Number(a.rowIndex))

            const noteDisplay =
              (info.statusMode === '🌙 剛下班待確認' ||
               info.statusMode === '剛下班待確認' ||
               info.statusMode === '⏳ 待確認 (Pending)')

                : (info.note
                    ? String(info.note)
                        .replace(/^\u200B/, '')
                        .replace(/^\[補\]\s*/, '')
                    : '-');

            let modeHtml;

            if (isOff) {
              modeHtml = '<span style="color:#7d6f63;font-weight:600;">OFF</span>';
            } else {
              const availableModes = [
                '🥳 只嗨 (High Only)',
                '🍷 只酒 (Drinks Only)',
                '🎉 都可以 (Both)',
                '📅 已預約',
                '🌙 剛下班待確認'

              if (currentMode === 'BOOK' || currentMode === '已預約') {
                currentMode = '📅 已預約';
              } else if (currentMode === '只嗨 (High Only)') {
                currentMode = '🥳 只嗨 (High Only)';
              } else if (currentMode === '只酒 (Drinks Only)') {
                currentMode = '🍷 只酒 (Drinks Only)';
              } else if (currentMode === '都可以 (Both)') {
                currentMode = '🎉 都可以 (Both)';
              } else if (
                currentMode === '⏳ 待確認 (Pending)' ||
                currentMode === '待確認' ||
                currentMode === 'Pending'

      const workingUsers = latestUsers.filter(info => info.type === '上班');

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderHistory() {
      const tbody = document.getElementById('historyTableBody');
      const keyword = document.getElementById('nameSearchInput').value.trim().toLowerCase();
      const range = document.getElementById('rangeFilter').value;
      const todayStr = getTodayStr();
      const now = new Date();

      let filtered = rawData.filter(r => {
        if (!r.name || r.name === '姓名') return false; 
        if (r.type === '狀態') return false; 
        if (keyword && !r.name.toLowerCase().includes(keyword)) return false;

        const rDate = new Date(r.date.replace(/-/g, '/'));

        if (range === 'daily') return r.date === todayStr;
        if (range === 'weekly') {
          const w = new Date();
          w.setDate(now.getDate() - 7);
          return rDate >= w && rDate <= now;
        }
        if (range === '3months') {
          const m = new Date();
          m.setDate(now.getDate() - 90);
          return rDate >= m && rDate <= now;
        }
        return true;
      });

      const displayList = [...filtered].reverse();

      if (displayList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="loading">查無符合條件的打卡紀錄</td></tr>';
        return;
      }

      tbody.innerHTML = '';

      displayList.forEach(item => {
        const tr = document.createElement('tr');
        const isManual = item.isManual === true;
        const statusDisplay = item.type;
        const tagClass = `tag-${item.type}`;
        const displayNote = String(item.note || '')
          .replace(/^\u200B/, '')
          .replace(/^\[補\]\s*/, '');

        let actionHtml = `<button type="button" class="btn-action btn-edit history-edit-btn"
            data-row-index="${Number(item.rowIndex)}"
            data-note="${escapeHtml(displayNote)}">✏️ 編輯</button>
          <button type="button" class="btn-action btn-delete history-delete-btn"
            data-row-index="${Number(item.rowIndex)}"><span class="delete-x">✕</span>刪除</button>`;
        if (isManual) {
          actionHtml += ` <span style="display:inline-block; margin-left:12px; font-size:0.75rem; background:#fef3c7; color:#92400e; padding:3px 6px; border-radius:4px; font-weight:600;" title="管理者補打卡">⚡ 補</span>`;
        }

        tr.innerHTML = `
          <td><strong>${item.name}</strong></td>
          <td>${item.date}</td>
          <td>${item.time}</td>
          <td>📍 ${item.location || '-'}</td>
          <td><span class="tag ${tagClass}">${statusDisplay}</span></td>
          <td>${displayNote}</td>
          <td>${actionHtml}</td>

      });

    function calculateSalary() {
      const keyword = document.getElementById('salaryNameInput').value.trim().toLowerCase();
      const sDate = document.getElementById('salaryStartDate').value;
      const eDate = document.getElementById('salaryEndDate').value;
      const tbody = document.getElementById('salaryTableBody');

      if (!keyword || !sDate || !eDate) {
        alert('請完整輸入姓名關鍵字與日期區間！');
        return;
      }

      const cleanSalaryNote = (note) => String(note || '')
        .replace(/\u200B/g, '')
        .replace(/^\[補\]\s*/, '')
        .trim();

      const escapeSalaryHtml = (value) => String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

      let filtered = rawData.filter(r =>
        r.name !== '姓名' &&
        r.type !== '狀態' &&
        (r.type === '上班' || r.type === '下班') &&
        r.name.toLowerCase().includes(keyword) &&
        r.date >= sDate &&
        r.date <= eDate
      );

      const groupMap = {};
      filtered.forEach(r => {
        const k = `${r.name}_${r.date}`;
        if (!groupMap[k]) groupMap[k] = [];
        groupMap[k].push(r);
      });

      const shiftList = [];

      Object.keys(groupMap).forEach(k => {
        const recs = groupMap[k].slice().sort((a, b) => a.time.localeCompare(b.time));
        let currentOn = null;

        recs.forEach(r => {
          if (r.type === '上班') {
            currentOn = r;
          } else if (r.type === '下班' && currentOn) {
            const hours = calcHours(currentOn.date, currentOn.time, r.date, r.time);

            const onNote = cleanSalaryNote(currentOn.note);
            const offNote = cleanSalaryNote(r.note);
            const noteList = [];
            if (onNote) noteList.push(onNote);
            if (offNote && offNote !== onNote) noteList.push(offNote);
            const shiftNote = noteList.join(' / ');

            const location = String(currentOn.location || r.location || '').trim();
            const locationKey = location.toLowerCase();

            const selfCollect =
              locationKey === 'sky' ||
              locationKey === '9號' ||
              locationKey === '9p'
                ? 100
                : 110;

            shiftList.push({
              name: currentOn.name,
              date: currentOn.date,
              startTime: currentOn.time,
              endTime: r.time,
              location: location || '-',
              selfCollect,
              fare: 0,
              hours,
              note: shiftNote
            });

            currentOn = null;
          }
        });
      });

      if (shiftList.length === 0) {
        document.getElementById('salarySummary').style.display = 'none';
        tbody.innerHTML = '<tr><td colspan="9" class="loading">無對應的完整班表紀錄</td></tr>';
      } else {
        tbody.innerHTML = '';
        shiftList.forEach(s => {
          const special = /^(sky|9號|9p)$/i.test(String(s.location || '').trim());
          const locationMarker = special ? '💎' : '📍';

          tbody.innerHTML += `
            <tr>
              <td><strong>${escapeSalaryHtml(s.name)}</strong></td>
              <td><input type="date" value="${escapeSalaryHtml(s.date)}" class="salary-date"></td>
              <td><input type="time" value="${escapeSalaryHtml(s.startTime)}" class="salary-time"></td>
              <td><input type="time" value="${escapeSalaryHtml(s.endTime)}" class="salary-time"></td>
              <td>
                <div style="display:flex; align-items:center; gap:3px; min-width:0;">
                  <span style="flex:0 0 auto;">${locationMarker}</span>
                  <input type="text" value="${escapeSalaryHtml(s.location === '-' ? '' : s.location)}" class="salary-location">
                </div>
              </td>
              <td><input type="number" class="input-money salary-self" value="${s.selfCollect}"></td>
              <td><input type="number" class="input-money salary-fare" value="${s.fare}"></td>
              <td><strong class="salary-row-hours">${escapeSalaryHtml(s.hours)}</strong> hr</td>
              <td>${escapeSalaryHtml(s.note || '')}</td>
            </tr>
          `;
        });
      }

      updateSalarySummary();

      document.getElementById('salaryEmptyTip').style.display = 'none';
      document.getElementById('salaryResultArea').style.display = 'block';
    }

    function updateSalarySummary() {
      const rows = document.querySelectorAll('#salaryTableBody tr');
      let totalHours = 0;
      let totalFare = 0;
      let totalSelfCollect = 0;

      rows.forEach(row => {
        const selfInput = row.querySelector('.salary-self');
        const fareInput = row.querySelector('.salary-fare');
        const hoursEl = row.querySelector('.salary-row-hours');

        const self = selfInput ? parseFloat(selfInput.value) : 0;
        const fare = fareInput ? parseFloat(fareInput.value) : 0;
        const hours = hoursEl ? parseFloat(hoursEl.textContent) : 0;

        totalSelfCollect += Number.isFinite(self) ? self : 0;
        totalFare += Number.isFinite(fare) ? fare : 0;
        totalHours += Number.isFinite(hours) ? hours : 0;
      });

      const rentInput = document.getElementById('rentAmount');
      const rent = rentInput ? (parseFloat(rentInput.value) || 0) : 0;
      const totalAmount = totalSelfCollect + totalFare - rent;

      document.getElementById('totalHours').textContent = totalHours.toFixed(1);
      document.getElementById('totalFare').textContent = totalFare.toFixed(0);
      document.getElementById('totalAmount').textContent = totalAmount.toFixed(0);
      document.getElementById('salarySummary').style.display = rows.length ? 'flex' : 'none';
    }

    document.addEventListener('input', function(e) {
      if (
        e.target.classList.contains('salary-self') ||
        e.target.classList.contains('salary-fare') ||
        e.target.id === 'rentAmount'
      ) {
        updateSalarySummary();
      }
    });

    function recalculateSalaryRow(row) {
      if (!row) return;

      const dateInput = row.querySelector('.salary-date');
      const timeInputs = row.querySelectorAll('.salary-time');
      const hoursEl = row.querySelector('.salary-row-hours');

      if (!dateInput || timeInputs.length < 2 || !hoursEl) return;

      const date = dateInput.value;
      const startTime = timeInputs[0].value;
      const endTime = timeInputs[1].value;

      if (!date || !startTime || !endTime) {
        hoursEl.textContent = '0.0';
        updateSalarySummary();
        return;
      }

      hoursEl.textContent = calcHours(date, startTime, date, endTime);
      updateSalarySummary();
    }

    document.addEventListener('change', function(e) {
      if (
        e.target.classList.contains('salary-date') ||
        e.target.classList.contains('salary-time')
      ) {
        recalculateSalaryRow(e.target.closest('tr'));
      }
    });

    function calcHours(d1, t1, d2, t2) {
      try {
        const start = new Date(`${d1.replace(/-/g, '/')} ${t1}`);
        const end = new Date(`${d2.replace(/-/g, '/')} ${t2}`);
        let diffMinutes = Math.floor((end - start) / (1000 * 60));
        if (diffMinutes < 0) diffMinutes += 24 * 60;

        const fullHours = Math.floor(diffMinutes / 60);
        const minutes = diffMinutes % 60;
        const roundedHours = fullHours + (minutes >= 45 ? 1 : minutes >= 15 ? 0.5 : 0);
        return roundedHours.toFixed(1);
      } catch (e) {
        return '0.0';
      }
    }

    let editingNoteRowIndex = null;

    function editNote(rowIndex, currentNote) {
      const numericRowIndex = Number(rowIndex);

      if (!Number.isInteger(numericRowIndex) || numericRowIndex < 2) {
        alert('無法取得這筆打卡紀錄的資料列，請重新整理後再試一次。');
        return;
      }

      const modal = document.getElementById('noteEditModal');
      const input = document.getElementById('editNoteInput');

      if (!modal || !input) {
        alert('編輯視窗載入失敗，請重新整理頁面。');
        return;
      }

      editingNoteRowIndex = numericRowIndex;
      input.value = String(currentNote || '');
      modal.style.display = 'flex';

      setTimeout(() => {
        input.focus();
        input.select();
      }, 50);
    }

    function closeEditNoteModal() {
      editingNoteRowIndex = null;
      const modal = document.getElementById('noteEditModal');
      if (modal) modal.style.display = 'none';
    }

    function saveEditedNote() {
      if (editingNoteRowIndex === null) return;

      const rowIndex = editingNoteRowIndex;
      const input = document.getElementById('editNoteInput');
      const saveBtn = document.getElementById('saveEditNoteBtn');
      const newNote = input ? input.value.trim() : '';

      if (!saveBtn) return;

      saveBtn.disabled = true;
      saveBtn.innerText = '儲存中...';

      const original = rawData.find(r => Number(r.rowIndex) === rowIndex);
      const wasManual = original && original.isManual === true;
      const noteToSave = wasManual ? `\u200B${newNote}` : newNote;

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'updateNote',
          rowIndex: rowIndex,
          note: noteToSave
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === 'success') {
          closeEditNoteModal();
          loadAllData();
        } else {
          throw new Error(res.message || '未知錯誤');
        }
      })
      .catch(err => {
        console.error(err);
        alert('備註更新失敗：' + (err.message || '請確認網路連線或 GAS。'));
      })
      .finally(() => {
        saveBtn.disabled = false;
        saveBtn.innerText = '儲存';
      });
    }

    // 個人打卡紀錄使用事件委派，避免 inline onclick 因備註特殊字元而失效。
    document.getElementById('historyTableBody').addEventListener('click', function(e) {
      const editBtn = e.target.closest('.history-edit-btn');
      if (editBtn) {
        editNote(
          Number(editBtn.dataset.rowIndex),
          editBtn.dataset.note || ''
        );
        return;
      }

      const deleteBtn = e.target.closest('.history-delete-btn');
      if (deleteBtn) {
        deleteRecord(Number(deleteBtn.dataset.rowIndex));
      }
    });

    document.getElementById('workingTableBody').addEventListener('click', function(e) {
      const editBtn = e.target.closest('.working-edit-btn');
      if (!editBtn) return;
      editNote(Number(editBtn.dataset.rowIndex), editBtn.dataset.note || '');
    });

    document.getElementById('cancelEditNoteBtn').addEventListener('click', closeEditNoteModal);
    document.getElementById('saveEditNoteBtn').addEventListener('click', saveEditedNote);

    document.getElementById('noteEditModal').addEventListener('click', function(e) {
      if (e.target === this) closeEditNoteModal();
    });

    document.getElementById('editNoteInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveEditedNote();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeEditNoteModal();
      }
    });

    function updateStatusModeFromDropdown(selectEl, rowIndex) {
      const newMode = selectEl.value;

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'updateStatusMode',
          rowIndex: rowIndex,
          statusMode: newMode
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === 'success') {
          loadAllData();
        } else {
          alert('選擇模式更新失敗：' + (res.message || '未知錯誤'));
          loadAllData();
        }
      })
      .catch(err => {
        console.error(err);
        alert('選擇模式更新失敗，請確認網路連線。');
        loadAllData();
      });
    }

    function deleteStatusRecord(rowIndex, name) {
      if (!confirm(`確定要刪除「${name}」目前的狀態紀錄嗎？`)) return;

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', rowIndex })
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === 'success') {
          loadAllData();
        } else {
          alert('刪除失敗：' + (res.message || '未知錯誤'));
        }
      })
      .catch(err => {
        console.error(err);
        alert('刪除失敗，請檢查網路或 GAS。');
      });
    }

    function deleteRecord(rowIndex) {
      if (!confirm(`確定要刪除第 ${rowIndex} 列紀錄嗎？`)) return;

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', rowIndex })
      })
      .then(res => res.json())
      .then(() => loadAllData());
    }

    function openAddModal() {
      document.getElementById('modalDate').value = getTodayStr();
      const now = new Date();
      document.getElementById('modalTime').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.getElementById('addModal').style.display = 'flex';
    }

    function closeAddModal() {
      document.getElementById('addModal').style.display = 'none';
    }

    function submitAddRecord() {
      const typeVal = document.getElementById('modalType').value;
      const userNote = document.getElementById('modalNote').value.trim();
      const finalNote = `\u200B${userNote}`;

      const payload = {
        name: document.getElementById('modalName').value.trim(),
        type: typeVal,
        date: document.getElementById('modalDate').value,
        time: document.getElementById('modalTime').value,
        location: document.getElementById('modalLocation').value.trim(),
        note: finalNote,
        statusIsOn: true,
        statusMode: typeVal === '上班' ? 'BOOK' : '⏳ 待確認 (Pending)'
      };

      if (!payload.name) {
        alert('請輸入姓名');
        return;
      }

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === 'success') {
          closeAddModal();
          document.getElementById('modalName').value = '';
          document.getElementById('modalLocation').value = '';
          document.getElementById('modalNote').value = '';
          loadAllData();
        } else {
          alert('新增失敗：' + (res.message || '未知錯誤'));
        }
      })
      .catch(err => {
        console.error(err);
        alert('新增失敗，請檢查網路或 GAS。');
      });
    }

    window.onload = () => {
      document.getElementById('salaryStartDate').value = getTodayStr();
      document.getElementById('salaryEndDate').value = getTodayStr();
      loadAllData();
      
      setInterval(loadAllData, 5000);
    };
  </script>

</body>
</html>
